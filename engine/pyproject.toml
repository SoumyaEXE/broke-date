[project]
name = "brokedate"
version = "0.1.0"
description = "Local-first runway forecaster: safe to spend today, 500 simulated futures, price in days."
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "tabpfn>=8",
  "lightgbm>=4.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "typer>=0.12",
  "httpx>=0.27",
  "psutil>=5.9",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "pyarrow>=16",
  "matplotlib>=3.8",
]

[project.scripts]
brokedate = "brokedate.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-socket>=0.7",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
  "pandas-stubs",
  "types-psutil",
]

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brokedate"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: loads TabPFN weights / runs heavy simulations",
  "ollama: needs a local Ollama server",
]
